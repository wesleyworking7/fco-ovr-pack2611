*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;

.tools input{flex:1 1 220px;min-width:180px}

.meta{font-size:12px;color:#607D8B;margin-bottom:8px}
.tablebox{overflow-x:auto;border:1px solid #E0E6ED;border-radius:8px}

.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}

var F = DATA.F, ORDER = DATA.order, PACKS = DATA.packs;
var SIZE = 50;
var st = {pack: ORDER[0], q: "", kind: "", pos: "", season: "", order: "ovr", page: 1, all: false};

function esc(s){
  if(s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uniq(arr){
  var o = {}, r = [], i;
  for(i=0;i<arr.length;i++){
    if(arr[i] && !o[arr[i]]){ o[arr[i]]=1; r.push(arr[i]); }
  }
  r.sort();
  return r;
}
function fillSel(el, vals, label){
  var h = '<option value="">' + esc(label) + '</option>', i;
  for(i=0;i<vals.length;i++){
    h += '<option value="' + esc(vals[i]) + '">' + esc(vals[i]) + '</option>';
  }
  el.innerHTML = h;
}
function buildTabs(){
  var h = "", i, k, p;
  for(i=0;i<ORDER.length;i++){
    k = ORDER[i]; p = PACKS[k];
    h += '<button type="button" class="tab' + (k===st.pack?' on':'') + '" data-k="' + esc(k) + '">'
       + esc(k) + '<small>' + p.total + ' 人</small></button>';
  }
  document.getElementById("tabs").innerHTML = h;
  var bs = document.getElementById("tabs").getElementsByTagName("button");
  for(i=0;i<bs.length;i++){
    bs[i].onclick = (function(key){
      return function(){ setPack(key); };
    })(bs[i].getAttribute("data-k"));
  }
}
function setPack(k){
  if(!PACKS[k]) return;
  st.pack = k; st.page = 1; st.q = ""; st.kind = ""; st.pos = ""; st.season = ""; st.all = false;
  document.getElementById("q").value = "";
  document.getElementById("all").innerHTML = "显示全部";
  buildTabs();
  var rows = PACKS[k].rows;
  fillSel(document.getElementById("kind"), ["赛季卡","ICON TM","ICON"], "全部类型");
  fillSel(document.getElementById("pos"), uniq(rows.map(function(r){return r[F.pos];})), "全部位置");
  fillSel(document.getElementById("season"), uniq(rows.map(function(r){return r[F.season];})), "全部赛季");
  document.getElementById("kind").value = "";
  document.getElementById("pos").value = "";
  document.getElementById("season").value = "";
  render();
}
function filtered(){
  var rows = PACKS[st.pack].rows, q = st.q.toLowerCase(), out = [], i, r;
  for(i=0;i<rows.length;i++){
    r = rows[i];
    if(st.kind && r[F.kind] !== st.kind) continue;
    if(st.pos && r[F.pos] !== st.pos) continue;
    if(st.season && r[F.season] !== st.season) continue;
    if(q){
      var s = (r[F.name] + " " + r[F.season] + " " + r[F.seasonFull]).toLowerCase();
      if(s.indexOf(q) < 0) continue;
    }
    out.push(r);
  }
  var o = st.order;
  out.sort(function(a,b){
    if(o === "ovr") return b[F.ovr] - a[F.ovr] || (a[F.name] < b[F.name] ? -1 : 1);
    if(o === "ovra") return a[F.ovr] - b[F.ovr] || (a[F.name] < b[F.name] ? -1 : 1);
    if(o === "season") return (a[F.season] < b[F.season] ? -1 : (a[F.season] > b[F.season] ? 1 : 0)) || b[F.ovr] - a[F.ovr];
    return a[F.name] < b[F.name] ? -1 : (a[F.name] > b[F.name] ? 1 : 0);
  });
  return out;
}
function render(){
  var p = PACKS[st.pack], list = filtered(), total = list.length;
  var size = st.all ? Math.max(1, total) : SIZE;
  var pages = Math.max(1, Math.ceil(total / size));
  if(st.page > pages) st.page = pages;
  var start = (st.page - 1) * size, end = Math.min(start + size, total);

  document.getElementById("desc").innerHTML =
      esc(st.pack) + ' 及以上球员包 · 2611期<br>共 <b>' + p.total
    + '</b> 名球员；六个包按 8强OVR 门槛分档，高档包是低档包的子集。';
  document.getElementById("kpi").innerHTML =
      '<div class="box"><div class="lab">本包可开出球员</div><div class="val">' + p.total + '</div></div>'
    + '<div class="box g"><div class="lab">赛季卡球员</div><div class="val">' + p.nonicon + '</div></div>'
    + '<div class="box p"><div class="lab">ICON 赛季球员</div><div class="val">' + p.icon + '</div></div>'
    + '<div class="box o"><div class="lab">8强OVR 门槛</div><div class="val">' + st.pack.replace("OVR","") + '+</div></div>';

  var h = "", i, r;
  if(total === 0){
    h = '<tr><td colspan="5" class="empty">没有符合条件的球员，请调整筛选条件。</td></tr>';
  }else{
    for(i=start;i<end;i++){
      r = list[i];
      h += '<tr class="' + (r[F.kind] === "赛季卡" ? "" : "icon") + '">'
        + '<td>' + (i+1) + '</td>'
        + '<td class="nm">' + esc(r[F.name]) + '</td>'
        + '<td>' + esc(r[F.season]) + '</td>'
        + '<td>' + esc(r[F.pos]) + '</td>'
        + '<td class="ovr">' + r[F.ovr] + '</td>'
        + '</tr>';
    }
  }
  document.getElementById("tbody").innerHTML = h;

  document.getElementById("meta").innerHTML = '共 <b>' + total + '</b> 名球员'
    + (total ? '，当前显示第 ' + (start+1) + '-' + end + ' 名' : '');
  document.getElementById("pager").innerHTML =
      '<button type="button" id="prev"' + (st.page<=1?' disabled':'') + '>上一页</button>'
    + '<span class="pi">第 ' + st.page + ' / ' + pages + ' 页</span>'
    + '<button type="button" id="next"' + (st.page>=pages?' disabled':'') + '>下一页</button>';
  document.getElementById("prev").onclick = function(){ if(st.page>1){st.page--;render();} };
  document.getElementById("next").onclick = function(){ if(st.page<pages){st.page++;render();} };
}
function bind(){
  var q = document.getElementById("q");
  var onQ = function(){ st.q = q.value.replace(/^\s+|\s+$/g,""); st.page=1; render(); };
  if(q.addEventListener) q.addEventListener("input", onQ, false);
  q.onkeyup = onQ;
  q.onchange = onQ;
  document.getElementById("kind").onchange = function(){st.kind=this.value;st.page=1;render();};
  document.getElementById("pos").onchange = function(){st.pos=this.value;st.page=1;render();};
  document.getElementById("season").onchange = function(){st.season=this.value;st.page=1;render();};
  document.getElementById("order").onchange = function(){st.order=this.value;st.page=1;render();};
  document.getElementById("all").onclick = function(){
    st.all = !st.all; st.page = 1;
    this.innerHTML = st.all ? "分页显示" : "显示全部";
    render();
  };
  document.getElementById("reset").onclick = function(){
    st.q="";st.kind="";st.pos="";st.season="";st.order="ovr";st.page=1;st.all=false;
    q.value="";
    document.getElementById("kind").value="";
    document.getElementById("pos").value="";
    document.getElementById("season").value="";
    document.getElementById("order").value="ovr";
    document.getElementById("all").innerHTML = "显示全部";
    render();
  };
}
try{
  buildTabs();
  setPack(ORDER[0]);
  bind();
}catch(e){
  document.getElementById("tbody").innerHTML =
    '<tr><td colspan="5" class="empty">页面初始化失败：' + esc(e.message) + '</td></tr>';
}
</script>
